<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo-list</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <h1>Мои задачи</h1>

    <form class="add" id="add-form" novalidate>
      <input type="text" id="task-input" placeholder="Что нужно сделать?" aria-label="Текст задачи" autocomplete="off">
      <button type="submit" class="btn">Добавить</button>
    </form>
    <p class="warning" id="warning" role="alert" hidden>Введите текст задачи</p>

    <p class="counter" id="counter">Осталось: 0, Выполнено: 0</p>

    <div class="filters" id="filters">
      <button type="button" class="filter is-active" data-filter="all">Все</button>
      <button type="button" class="filter" data-filter="active">Активные</button>
      <button type="button" class="filter" data-filter="completed">Завершённые</button>
    </div>

    <ul class="list" id="task-list"></ul>
    <p class="empty" id="empty" hidden>Здесь пока ничего нет</p>
  </main>
</body>
</html>
